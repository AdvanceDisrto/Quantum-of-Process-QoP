name: QoP v03 acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qop_wire
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: cargo test --release -- --nocapture
  rtl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qop_wire
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: iverilog -g2012 -s tb_release -o /tmp/cih rtl/cih_release.sv rtl/tb_release.sv && vvp /tmp/cih
      - run: yosys -p 'read_verilog -sv rtl/cih_release.sv; synth -top cih_release; stat'
